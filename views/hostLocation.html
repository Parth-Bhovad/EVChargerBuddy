<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Your EV Location</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #34495e;
        }

        .success-msg {
            color: green;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Add Your Location</h2>
        <input type="text" id="name" placeholder="Your Name">
        <input type="email" id="email" placeholder="Email">
        <input type="tel" id="number" placeholder="Phone Number">

        <button id="gpsBtn">Get My Location</button>
        <button id="saveBtn">Save Location</button>

        <div class="success-msg" id="successMsg"></div>
    </div>

    <script>
        let userLat = null;
        let userLon = null;

        document.getElementById('gpsBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    alert(`Location captured!\nLatitude: ${userLat}\nLongitude: ${userLon}`);
                },
                (err) => {
                    alert(`Error (${err.code}): ${err.message}`);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const number = document.getElementById('number').value.trim();

            if (!name || !email || !number || !userLat || !userLon) {
                alert('Please fill all fields and get your location first.');
                return;
            }

            const payload = {
                name,
                email,
                number,
                location: {
                    type: "Point",
                    coordinates: [userLon, userLat] // MongoDB expects [lon, lat]
                }
            };

            try {
                const res = await fetch('http://localhost:3000/api/v1/users', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('successMsg').innerText = 'Location saved successfully!';
                } else {
                    const error = await res.json();
                    alert('Error: ' + (error.message || 'Failed to save'));
                }
            } catch (err) {
                console.error(err);
                alert('Error saving location');
            }
        });
    </script>
</body>

</html>
