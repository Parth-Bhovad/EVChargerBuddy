<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVChargerBuddy – Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800 bg-gray-50">
  <!-- Navbar -->
  <header class="bg-white shadow-md fixed w-full z-50">
    <nav class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="text-2xl font-bold text-teal-600">EVChargerBuddy</a>
      <ul class="hidden md:flex space-x-8">
        <li><a href="/signup" class="hover:text-teal-600">Signup</a></li>
        <li><a href="/login" class="hover:text-teal-600">Login</a></li>
        <li><a href="/profile" class="text-teal-600 font-semibold">Profile</a></li>
        <li><a href="/map" class="hover:text-teal-600">Map</a></li>
      </ul>
    </nav>
  </header>

  <!-- Profile Content -->
  <section class="pt-28 pb-20">
    <div class="container mx-auto px-4 max-w-2xl">
      <h1 class="text-3xl font-bold mb-8 text-center">My Profile</h1>

      <!-- Profile Card -->
      <div class="bg-white rounded-2xl shadow p-6">
        <div class="flex items-center space-x-6">
          <img src="https://ui-avatars.com/api/?name=Rahul+Sharma&background=2dd4bf&color=fff&size=96" alt="User Avatar" class="rounded-full w-24 h-24">
          <div>
            <h2 class="text-2xl font-semibold">Rahul Sharma</h2>
            <p class="text-gray-500">rahul.sharma@example.com</p>
            <p class="text-gray-500">+91 9876543210</p>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-4">
          <div class="bg-gray-50 rounded-xl p-4">
            <h3 class="font-semibold text-gray-700">Location</h3>
            <p class="text-gray-500">Palghar, Maharashtra</p>
          </div>
          <div class="bg-gray-50 rounded-xl p-4">
            <h3 class="font-semibold text-gray-700">Charging Price</h3>
            <p class="text-gray-500">₹15 / kWh</p>
          </div>
        </div>

        <div class="mt-6 text-center">
          <a href="/edit-profile" class="inline-block bg-teal-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-teal-700 transition">
            Edit Profile
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white py-6 border-t">
    <div class="container mx-auto px-4 text-center text-gray-500">
      © 2025 EVChargerBuddy. All rights reserved.
    </div>
  </footer>
</body>
</html>
